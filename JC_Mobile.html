<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Medique · Panel Móvil</title>
<link rel="preconnect" href="https://unpkg.com">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="dns-prefetch" href="https://firestore.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;-webkit-text-size-adjust:100%}
  body{font-family:'Jost',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#070707;-webkit-font-smoothing:antialiased}
  #root{height:100%}
  button{font-family:inherit}input,select,textarea{font-family:inherit}
  select{-webkit-appearance:none}
  .medique-stage{min-height:100dvh;display:flex;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,Roboto,sans-serif;color:#F6FAFF}
  .medique-phone-shell{width:100%;height:100dvh;max-width:430px;background:#07182E;overflow:hidden}
  .medique-screen{width:100%;height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(16,54,101,.14),rgba(7,28,58,.34));box-shadow:0 0 80px rgba(0,0,0,.28);overflow:hidden}
  .medique-ref-stage{width:100%;height:100dvh;min-height:100dvh;display:grid;place-items:center;overflow:hidden;background:#07182E;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text','Segoe UI',system-ui,Roboto,sans-serif}
  .medique-ref-frame{position:relative;width:min(100vw,calc(100dvh * 863 / 1822),863px);aspect-ratio:863/1822;overflow:hidden;background:#07182E}
  .medique-ref-image{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
  .medique-hotspot{position:absolute;z-index:2;border:0;border-radius:999px;background:rgba(255,255,255,0);color:transparent;cursor:pointer;padding:0;appearance:none;-webkit-appearance:none;touch-action:manipulation}
  .medique-hotspot:focus-visible{outline:2px solid rgba(126,177,255,.72);outline-offset:2px}
  .medique-hotspot.agenda-cta{left:67%;top:54.2%;width:16%;height:3.8%}
  .medique-hotspot.new-cta{left:16%;top:44.6%;width:16.8%;height:7.2%}
  .medique-hotspot.nav-citas{left:14.5%;bottom:6.4%;width:14%;height:6.3%}
  .medique-hotspot.nav-agenda{left:29%;bottom:6.4%;width:14%;height:6.3%}
  .medique-hotspot.fab-new{left:69.5%;top:74.4%;width:15%;height:7.8%}
  .medique-hotspot.back-new{left:12.8%;top:12.6%;width:8%;height:4.8%}
  .medique-hotspot.close-new{left:77.2%;top:12.6%;width:8%;height:4.8%}
  .medique-hotspot.cancel-new{left:36%;top:81.1%;width:28%;height:4.2%}
  @media (min-width:700px){
    .medique-stage{align-items:center;padding:28px 0}
    .medique-phone-shell{width:454px;height:956px;border:12px solid #06090f;border-radius:62px;box-shadow:0 34px 100px rgba(0,0,0,.58),0 0 0 2px rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.16)}
    .medique-screen{border-radius:48px}
  }
  @keyframes jcFade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @keyframes jcPop{0%{transform:scale(.7);opacity:0}70%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
  @keyframes jcDrawerIn{from{transform:translateX(-100%)}to{transform:none}}
  .jc-scroll::-webkit-scrollbar{width:0;height:0}
</style>
</head>
<body>
<div id="root"></div>

<!-- React (producción) — sin Babel: JSX pre-compilado en dist/ -->
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

<script>
  window.useState = React.useState;
  window.useEffect = React.useEffect;
  window.useRef = React.useRef;
  window.useMemo = React.useMemo;
</script>

<script src="jc-proto/jc-theme.js?v=76"></script>
<script src="jc-proto/jc-data.js?v=82"></script>
<script src="jcm_shared.js?v=82"></script>
<script src="jcm_cloud.js?v=71"></script>
<!-- SaaS multi-clínica (Firebase). Si no hay config, usa el acceso local. -->
<script src="jcm_saas_config.js?v=7"></script>
<script src="jcm_saas.js?v=28"></script>

<script src="/dist/jc-mobile.js?v=29"></script>
</body>
</html>
